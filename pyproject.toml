[project]
name = "quant-harbor"
version = "0.1.0"
description = "Self-hosted exchange account and strategy trading console"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "ccxt>=4.4,<5",
  "cryptography>=43,<47",
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

